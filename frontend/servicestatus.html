<body class="bg-[#f0f4f8] text-gray-900" style="font-family:'Noto Sans JP',sans-serif;">

<!-- ヘッダー -->
<header class="bg-blue-800 text-white shadow-xl sticky top-0 z-40" style="padding-top:env(safe-area-inset-top,0px);">
  <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="min-w-0">
      <p class="text-[10px] font-black tracking-wider text-blue-200">バスタイム</p>
      <h1 class="text-xl font-bold tracking-tight truncate">路線バス運行状況</h1>
      <p class="text-[10px] opacity-90 font-bold uppercase tracking-widest">Alpico Traffic Status</p>
    </div>
    <div class="flex items-center gap-2 flex-wrap justify-end shrink-0">
      <a href="/" class="bg-white text-blue-800 px-3 py-2 rounded-lg hover:bg-blue-50 transition shadow-md text-xs font-bold">トップへ</a>
      <button id="refresh-btn" class="bg-white text-blue-800 p-2 rounded-lg hover:bg-blue-50 transition shadow-md flex items-center gap-1">
        <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span class="text-xs font-bold">更新</span>
      </button>
    </div>
  </div>
</header>

<!-- ローディング -->
<div id="loading" class="fixed inset-0 bg-white/95 z-50 flex flex-col justify-center items-center">
  <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
  <p class="mt-4 text-lg font-bold text-blue-900">運行状況を読み込み中...</p>
</div>

<main class="max-w-3xl mx-auto px-4 pt-6 has-bottom-nav" id="app-content" style="display:none;">

  <div class="bg-white rounded-2xl shadow-sm border-2 border-blue-100 p-4 mb-6">
    <p class="text-sm font-bold text-gray-700">出典：アルピコ交通株式会社 公式サイト（松本地区）</p>
    <p id="source-updated" class="text-xs text-gray-500 mt-1"></p>
    <p id="scraped-at" class="text-[10px] text-gray-400 mt-1"></p>
  </div>

  <div id="status-container" class="space-y-8"></div>

  <p id="empty-note" class="text-sm text-gray-500 px-1" style="display:none;">運行状況データを取得できませんでした。しばらくしてから再度お試しください。</p>

  <section class="bg-gray-200 p-5 rounded-2xl border border-gray-300 mt-8 mb-6">
    <h2 class="text-md font-bold text-gray-700 mb-2 underline decoration-blue-500 decoration-2">ご利用にあたって</h2>
    <p class="text-sm text-gray-700 leading-relaxed font-bold">このページの情報は、アルピコ交通公式サイトを1時間ごとに自動取得したものです。最新の正確な情報は必ず公式サイトでご確認ください。</p>
    <a href="https://www.alpico.co.jp/traffic/trafficinfo/matsumoto/" target="_blank" class="mt-3 bg-white border border-blue-600 text-blue-700 p-3 rounded-lg font-bold flex justify-center items-center text-sm shadow-sm">
      公式サイトで詳しく見る
    </a>
  </section>

</main>
